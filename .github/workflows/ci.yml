name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feature/**"

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js for Azure Functions Core Tools
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Azure Functions Core Tools
        run: npm i -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Verify Azure Functions Core Tools
        run: func --version

      - name: Restore
        run: |
          dotnet restore FinanceTracker.csproj
          dotnet restore Tests/UnitTests/UnitTests.csproj
          dotnet restore Tests/IntegrationTests/IntegrationTests.csproj

      - name: Build
        run: dotnet build FinanceTracker.csproj --configuration Release --no-restore

      - name: Run tests
        run: scripts/test/run-tests.sh all --configuration Release --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            artifacts/test-results/**/*.trx
          if-no-files-found: ignore
