name: Build and Deploy Vela API Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Api/**"
      - "Application/**"
      - "Domain/**"
      - "Infrastructure/**"
      - "Tests/**"
      - "Program.cs"
      - "Vela.csproj"
      - "build/vela.sln"
      - "host.json"
      - "global.json"
      - ".github/workflows/dev-deploy-vela-api-functions.yml"

permissions:
  id-token: write
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup Node.js for Azure Functions Core Tools
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install Azure Functions Core Tools
        run: npm i -g azure-functions-core-tools@4 --unsafe-perm true

      - name: Verify Azure Functions Core Tools
        run: func --version

      - name: Restore
        run: |
          dotnet restore Vela.csproj
          dotnet restore Tests/UnitTests/UnitTests.csproj
          dotnet restore Tests/IntegrationTests/IntegrationTests.csproj

      - name: Build
        run: dotnet build Vela.csproj --configuration Release --no-restore

      - name: Test
        run: |
          dotnet test Tests/UnitTests/UnitTests.csproj --configuration Release --no-restore --verbosity normal
          dotnet test Tests/IntegrationTests/IntegrationTests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish
        run: dotnet publish Vela.csproj --configuration Release --output ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: ./publish
